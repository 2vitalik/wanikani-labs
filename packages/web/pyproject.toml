[project]
name = "wklabs-web"
version = "0.0.0"
description = "wanikani-labs FastAPI backend (stats API; Vue frontend in vue/)"
requires-python = ">=3.12"
dependencies = [
    "wklabs-lib",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.scripts]
wklabs-web = "wklabs.web.main:main"

[tool.uv.sources]
wklabs-lib = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wklabs"]
