[project]
name = "wklabs-lib"
version = "0.0.0"
description = "wanikani-labs core: settings, Mongo, WaniKani API client, sync engine, events"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=43",
    "httpx>=0.27",
    "pydantic>=2.8",
    "pydantic-settings>=2.6",
    "pymongo>=4.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wklabs"]
